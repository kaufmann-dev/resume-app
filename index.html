<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Kaufmann</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./editor.css">
</head>

<body class="is-auth-view">
  <!-- Auth Section -->
  <div id="auth-container">
    <div class="auth-card">
      <h2 id="auth-title">Private Access</h2>
      <input type="password" id="passcode-input" placeholder="Enter Passcode..." autofocus>
      <button id="login-btn">View Resume</button>
      <div class="auth-divider"><span id="auth-divider-label">or</span></div>
      <button class="auth-admin-button" id="admin-login-btn">Admin sign in</button>
      <div id="auth-error" role="alert"></div>
    </div>
  </div>

  <!-- CV Section -->
  <div id="cv-container">
    <nav class="section-nav" id="section-nav"></nav>
    <div class="cv">
      <header>
        <div class="hdr-top">
          <h1 class="name">David Kaufmann</h1>
          <div class="toolbar-wrap" id="toolbar-wrap">
            <button class="menu-btn" id="btn-menu" aria-expanded="false" aria-controls="toolbar">
              <i data-lucide="menu"></i>
              <span id="menu-label">Menu</span>
            </button>
            <div class="toolbar" id="toolbar">
              <button class="tbtn" id="btn-edit" style="display:none">
                <i data-lucide="square-pen"></i>
                <span class="tbtn-label"></span>
              </button>
              <button class="tbtn" id="btn-view">
                <i data-lucide="list-plus" id="ico-expand"></i>
                <i data-lucide="list-minus" id="ico-collapse"></i>
                <span class="tbtn-label"></span>
              </button>
              <button class="tbtn" id="btn-theme">
                <i data-lucide="sun" id="ico-sun"></i>
                <i data-lucide="moon" id="ico-moon"></i>
                <span class="tbtn-label"></span>
              </button>
              <button class="tbtn" id="btn-dl">
                <i data-lucide="download"></i>
                <span class="tbtn-label"></span>
              </button>
              <button class="tbtn" id="btn-lang">
                <i data-lucide="languages"></i>
                <span class="tbtn-label"></span>
              </button>
              <button class="tbtn" id="btn-logout" style="display:none">
                <i data-lucide="log-out"></i>
                <span class="tbtn-label"></span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <div id="cv-body"></div>
    </div>
  </div>

  <!-- Editor Section -->
  <div id="editor-container" style="display:none"></div>

  <!-- Legal Footer -->
  <footer id="legal-footer">
    <a href="https://legal.kaufmann.dev/imprint?site=resume.kaufmann.dev" id="link-imprint" target="_blank">Imprint</a>
    <span class="sep">•</span>
    <a href="https://legal.kaufmann.dev/privacy?site=resume.kaufmann.dev" id="link-privacy" target="_blank">Privacy</a>
  </footer>

  <script type="module" src="./main.js"></script>
</body>

</html>
